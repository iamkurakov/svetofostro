<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ECECDC">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%23351E1C'/%3E%3Ccircle cx='16' cy='8.5' r='3.2' fill='%23FF6037'/%3E%3Ccircle cx='16' cy='16' r='3.2' fill='%23733635'/%3E%3Ccircle cx='16' cy='23.5' r='3.2' fill='%23A0C9CB'/%3E%3C/svg%3E">
<title>Рецепты Светофора</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Мягкий карточный интерфейс в палитре: Morning Snow / Amazon Mist / Aqua Mist / Toxic Orange / Black Kite / Garnet */
:root{
  --mist:#ECECDC; --snow:#F5F4ED; --card:#FBFAF5; --aqua:#A0C9CB; --aqua-l:#D3E5E4; --orange:#FF6037; --orange-l:#FFE1D6;
  --kite:#351E1C; --garnet:#733635; --mute:#7C6B67; --line:#E2E0D0;
  --shadow:0 1px 2px rgba(53,30,28,.04),0 6px 20px rgba(53,30,28,.05);
  --r:22px; --r-s:14px; --font:'Manrope','Segoe UI',Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
:root{padding-top:env(safe-area-inset-top,0px)}
body{margin:0;-webkit-tap-highlight-color:transparent;background:var(--mist);color:var(--kite);font:15px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body.lock{overflow:hidden}
.wrap{max-width:1260px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:22px 64px}
h1,h2,h3,h4{margin:0;line-height:1.2;text-wrap:balance}
h1{font-size:22px;font-weight:800;letter-spacing:-.01em}
h2{font-size:clamp(20px,2.2vw,26px);font-weight:800;letter-spacing:-.01em}
h3{font-size:14px;font-weight:700;color:var(--mute)}
h4{font-size:16px;font-weight:700;line-height:1.3}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.ic{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mute{color:var(--mute)}.sm{font-size:13px}.bad{color:var(--garnet)}
.card{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow)}
.empty{color:var(--mute);padding:28px;text-align:center}
.empty.big{padding:56px 20px;display:grid;gap:10px;justify-items:center}
.empty.big p{margin:0;font-weight:700;color:var(--kite);font-size:16px}
.ic-big{width:44px;height:44px;color:var(--mute);stroke-width:1.4}

/* шапка */
.top{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:12px;min-width:0}
.logo{display:flex;flex-direction:column;gap:3px;background:var(--kite);border-radius:12px;padding:7px 10px;flex:none}
.logo i{width:7px;height:7px;border-radius:50%;background:var(--garnet)}
.logo i:nth-child(1){background:var(--orange)}.logo i:nth-child(3){background:var(--aqua)}
.bk-btn{display:inline-flex;align-items:center;gap:10px;border:0;border-radius:999px;background:var(--card);box-shadow:var(--shadow);padding:10px 14px 10px 18px;font-weight:700;font-size:14px;cursor:pointer;flex:none}
.bk-btn:hover{background:var(--snow)}
.bk-n{min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--mist);display:grid;place-items:center;font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
.bk-n:empty::before{content:"0"}
.bk-btn.has .bk-n{background:var(--orange)}
.bk-float{display:none}

/* поиск */
.searchbox{position:relative}
.search{display:flex;align-items:center;gap:10px;background:var(--card);border-radius:999px;padding:0 18px;color:var(--mute);box-shadow:var(--shadow)}
.search.big{height:56px;font-size:15.5px}
.search.big .ic{width:22px;height:22px}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;color:var(--kite);padding:11px 0;outline:none}
.search input::-webkit-search-cancel-button{display:none}
.search:focus-within{box-shadow:0 0 0 2px var(--aqua),var(--shadow)}
.qx{width:30px;height:30px;border-radius:50%;border:0;background:var(--mist);display:grid;place-items:center;cursor:pointer;color:var(--mute);flex:none}
.qx .ic{width:15px;height:15px}
.drop{position:absolute;left:0;right:0;top:calc(100% + 8px);z-index:12;background:var(--card);border-radius:var(--r);box-shadow:0 16px 40px rgba(53,30,28,.16);padding:8px;display:grid;gap:2px}
.drop-i{display:flex;align-items:center;gap:10px;text-align:left;background:transparent;border:0;border-radius:var(--r-s);padding:10px 12px;cursor:pointer}
.drop-i:hover,.drop-i.hl{background:var(--aqua-l)}
.sku-t{display:grid;gap:1px;flex:1;min-width:0}
.sku-n{font-size:14px;font-weight:600;line-height:1.35}
.sku-m{font-size:12.5px;color:var(--mute)}
.sku-c{min-width:30px;height:30px;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-size:12.5px;font-weight:700;flex:none}

/* полки товаров */
.shelves{display:grid;grid-template-columns:minmax(0,1fr);gap:18px;margin:22px 0 30px}
.shelf{min-width:0}
.shelf h3{margin:0 0 10px 4px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.pcard{display:flex;flex-direction:column;justify-content:space-between;gap:10px;text-align:left;border:0;border-radius:18px;background:var(--card);box-shadow:var(--shadow);padding:14px 16px;min-height:96px;cursor:pointer;transition:transform .15s,background .15s}
.pcard:hover{transform:translateY(-2px)}
.pcard.on{background:var(--aqua)}
.pc-n{font-size:14px;font-weight:700;line-height:1.35}
.pc-c{font-size:12.5px;font-weight:600;color:var(--mute)}
.pcard.on .pc-c{color:rgba(53,30,28,.75)}

/* рецепты */
.recipes{scroll-margin-top:16px}
.rhead{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;background:var(--kite);color:var(--snow);border-radius:var(--r);padding:20px 24px}
.rh-k{font-size:13px;font-weight:600;opacity:.7}
.rhead h2{margin-top:4px}
.rh-n{min-width:44px;height:44px;padding:0 10px;border-radius:999px;background:var(--orange);color:var(--kite);display:grid;place-items:center;font-size:18px;font-weight:800;flex:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0}
.chip{background:var(--card);border:0;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:600;cursor:pointer;color:var(--mute)}
.chip:hover{color:var(--kite)}
.chip.on{background:var(--kite);color:var(--snow)}
.rgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px;margin-top:14px;align-items:start}
.chips + .rgrid{margin-top:0}
.rc{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0;border:2px solid transparent}
.rc.saved{border-color:var(--orange)}
.rc-top{display:flex;gap:12px;align-items:flex-start}
.rc-ic{width:42px;height:42px;border-radius:50%;background:var(--mist);display:grid;place-items:center;flex:none}
.rc-t{display:grid;gap:3px;min-width:0}
.rc-m{display:flex;align-items:center;gap:5px;font-size:12.5px;color:var(--mute);font-weight:600;flex-wrap:wrap}
.rc-m .ic{width:14px;height:14px}
.gchips{display:flex;flex-wrap:wrap;gap:6px}
.g{background:var(--snow);border-radius:10px;padding:5px 10px;font-size:12.5px;color:var(--mute);font-weight:600}
.g b{color:var(--kite);font-weight:700;white-space:nowrap}
.g.hero{background:var(--aqua-l);color:var(--kite)}
.rc-s{margin:0;font-size:13.5px;color:var(--mute);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.rc-full{display:grid;gap:10px;border-top:1px solid var(--line);padding-top:14px}
.rc-full h4{font-size:14px}
.ings{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.ings li{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-radius:12px}
.ings li:nth-child(odd){background:var(--snow)}
.ings li.hero{background:var(--aqua-l)}
.i-n{display:grid;font-size:14px;font-weight:600;min-width:0}
.i-n small{font-size:12px;color:var(--mute);font-weight:500}
.i-q{font-weight:700;font-size:14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.steps{list-style:none;counter-reset:s;margin:0;padding:0;display:grid;gap:6px}
.steps li{counter-increment:s;display:flex;gap:10px;background:var(--snow);border-radius:12px;padding:10px 12px;font-size:14px}
.steps li::before{content:counter(s);width:22px;height:22px;border-radius:50%;background:var(--kite);color:var(--snow);display:grid;place-items:center;font-size:11.5px;font-weight:800;flex:none}
.note{font-size:13px;color:var(--mute);margin:0}
.rc-act{display:flex;gap:8px;margin-top:auto}
.rbtn{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:999px;background:var(--mist);padding:11px 14px;font-size:13.5px;font-weight:700;cursor:pointer;white-space:nowrap}
.rbtn .ic{width:18px;height:18px;stroke-width:2.2}
.rbtn:hover{background:var(--line)}
.rbtn.save{background:var(--kite);color:var(--snow)}
.rbtn.save:hover{filter:brightness(1.25)}
.rbtn.save.on{background:var(--orange);color:var(--kite)}

/* окна */
.back{position:fixed;inset:0;background:rgba(53,30,28,.3);z-index:20}
.drawer{position:fixed;top:12px;right:12px;bottom:12px;width:min(480px,calc(100% - 24px));background:var(--snow);z-index:21;overflow-y:auto;border-radius:28px;box-shadow:0 20px 60px rgba(53,30,28,.25)}
.drawer.center{top:50%;left:50%;right:auto;bottom:auto;transform:translate(-50%,-50%);width:min(560px,calc(100% - 24px));max-height:calc(100% - 48px)}
.grab{display:none}
.dr-head{position:sticky;top:0;background:var(--snow);display:flex;align-items:center;gap:12px;padding:18px 20px 12px;z-index:1}
.dr-head h2{font-size:20px;flex:1}
.dr-head .rh-n{min-width:34px;height:34px;font-size:15px}
.iconbtn{width:40px;height:40px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn.sm{width:34px;height:34px;box-shadow:none;background:var(--mist)}
.iconbtn.sm .ic{width:16px;height:16px}
.dr-body{padding:4px 20px 24px}
.blist{display:grid;gap:8px}
.bitem{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:18px;padding:12px;box-shadow:var(--shadow)}
.bi-t{display:grid;gap:1px;flex:1;min-width:0}
.bi-t b{font-size:14.5px}
.bi-t>span:not(.rc-m){font-size:12.5px;color:var(--mute)}
.bfoot{display:grid;gap:10px;justify-items:center;margin-top:16px;position:sticky;bottom:0;background:var(--snow);padding:12px 0 4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;background:var(--mist);border:0;border-radius:999px;padding:11px 18px;font-size:14px;font-weight:700;cursor:pointer;white-space:nowrap}
.btn .ic{width:18px;height:18px}
.btn:hover{background:var(--line)}
.btn.pri{background:var(--orange);color:var(--kite)}
.btn.pri:hover{filter:brightness(.95);background:var(--orange)}
.btn.wide{width:100%;padding:14px}
.lnk{background:none;border:0;padding:4px;cursor:pointer;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:6px}
.lnk.mute{color:var(--mute)}
.lnk .ic{width:16px;height:16px}
.shop{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:6px;margin:10px 0 12px}
.sh-r{display:flex;justify-content:space-between;gap:16px;padding:11px 12px;border-radius:12px}
.sh-r:nth-child(odd){background:var(--snow)}
.sh-n{font-size:14px;font-weight:600;min-width:0}
.sh-q{font-size:14px;font-weight:800;white-space:nowrap;font-variant-numeric:tabular-nums}
.sh-r.total{background:var(--kite)!important;color:var(--snow);margin-top:4px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--kite);color:var(--snow);padding:10px 18px;border-radius:999px;z-index:40;font-size:14px;font-weight:600;max-width:calc(100% - 32px)}
.copybuf{position:fixed;left:16px;right:16px;bottom:96px;height:140px;z-index:39;border-radius:14px;font:13px var(--font)}

@media (max-width:700px){
  .wrap{padding-bottom:110px}
  .top .bk-btn{display:none}
  .bk-float{display:inline-flex;position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:15;background:var(--orange);color:var(--kite);padding:14px 16px 14px 18px;box-shadow:0 8px 24px rgba(255,96,55,.35)}
  .bk-float .bk-n{background:var(--kite)!important;color:var(--snow)}
  .search.big{height:52px;padding:0 16px}
  .shelves{gap:14px;margin:18px 0 24px}
  .pgrid{display:grid;grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:minmax(150px,44%);gap:8px;overflow-x:auto;scroll-snap-type:x proximity;margin-inline:-16px;padding:2px 16px 8px;scrollbar-width:none;overscroll-behavior-x:contain}
  .pgrid::-webkit-scrollbar{display:none}
  .pcard{padding:12px;min-height:92px;scroll-snap-align:start;scroll-margin-left:16px}
  .pcard:hover{transform:none}
  .toast{bottom:auto;top:calc(14px + env(safe-area-inset-top,0px))}
  .recipes .chips{flex-wrap:nowrap;overflow-x:auto;margin-inline:-16px;padding:2px 16px;scrollbar-width:none}
  .recipes .chips::-webkit-scrollbar{display:none}
  .chip{flex:none}
  .rc{padding:16px}
  .pc-n{font-size:13px}
  .rgrid{grid-template-columns:minmax(0,1fr)}
  .rhead{padding:18px}
  .rbtn span{font-size:13px}
  .drawer,.drawer.center{top:auto;left:0;right:0;bottom:0;transform:none;width:100%;max-height:92%;border-radius:28px 28px 0 0;padding-bottom:env(safe-area-inset-bottom,0px)}
  .grab{display:block;width:40px;height:5px;border-radius:999px;background:var(--line);margin:10px auto 0}
  .dr-head{padding-top:10px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}

</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="brand"><span class="logo" aria-hidden="true"><i></i><i></i><i></i></span><h1>Рецепты Светофора</h1></div>
    <button class="bk-btn" data-act="open-basket"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.5 9.2a2 2 0 0 1-2 1.8h-9a2 2 0 0 1-2-1.8z"/><path d="M8.5 9l3.5-5 3.5 5"/></svg><span class="bk-l">Корзина рецептов</span><b class="bk-n"></b></button>
  </header>
  <main id="main"></main>
</div>
<button class="bk-btn bk-float" data-act="open-basket" aria-label="Корзина рецептов"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h16l-1.5 9.2a2 2 0 0 1-2 1.8h-9a2 2 0 0 1-2-1.8z"/><path d="M8.5 9l3.5-5 3.5 5"/></svg><b class="bk-n"></b></button>
<div id="back" class="back" data-act="close" hidden></div>
<aside id="drawer" class="drawer" hidden aria-label="Корзина"></aside>
<div id="toast" class="toast" role="status" hidden></div>
<textarea id="copybuf" class="copybuf" hidden aria-label="Текст для копирования"></textarea>
<script>
/* ===== ДАННЫЕ: справочник ингредиентов, ассортимент, каталог рецептов ===== */
const CATALOG_V = '1.0 · 08.10.2026';

/* Ингредиенты: кулинарные типы. syn — ключи для сопоставления названий при импорте */
const ING = {
  kolb_var:{n:'Колбаса докторская',g:'Колбасы',syn:['колбаса варен','докторск','колбаса вар','молочная колбас']},
  vetch:{n:'Ветчина',g:'Колбасы',syn:['ветчин']},
  kolb_pk:{n:'Колбаса полукопчёная',g:'Колбасы',syn:['п/к','полукопч','сервелат']},
  sosiski:{n:'Сосиски',g:'Колбасы',syn:['сосиск','сардельк']},
  tushenka:{n:'Тушёнка',g:'Консервы',syn:['тушен','говядина туш','свинина туш']},
  pelm:{n:'Пельмени',g:'Заморозка',syn:['пельмен']},
  tvorog:{n:'Творог',g:'Молочная продукция',syn:['творог']},
  desert_tv:{n:'Творожный десерт',g:'Молочная продукция',syn:['десерт с творог','творожный десерт','творожн десерт']},
  yog:{n:'Йогурт',g:'Молочная продукция',syn:['йогурт']},
  moroz:{n:'Мороженое',g:'Заморозка',syn:['морожен','пломбир']},
  moloko:{n:'Молоко',g:'Молочная продукция',syn:['молоко']},
  kefir:{n:'Кефир',g:'Молочная продукция',syn:['кефир']},
  ryazh:{n:'Ряженка',g:'Молочная продукция',syn:['ряженк']},
  smetana:{n:'Сметана',g:'Молочная продукция',syn:['сметан']},
  slivki:{n:'Сливки',g:'Молочная продукция',syn:['сливки ']},
  maslo_sl:{n:'Масло сливочное',g:'Молочная продукция',syn:['масло сливоч','сливочное масло']},
  syr_tv:{n:'Сыр твёрдый / полутвёрдый',g:'Сыры',syn:['сыр ','сырный продукт','российск','голландск','гауда','пошехон','маасдам','костромск']},
  syr_pl_pasta:{n:'Плавленый сыр пастообразный',g:'Сыры',syn:['сыр плавл','плавленый сыр','ванночк','сырок плавл']},
  syr_pl_lomt:{n:'Плавленый сыр ломтевой',g:'Сыры',syn:['ломтев','плавленый продукт']},
  suluguni:{n:'Сулугуни',g:'Сыры',syn:['сулугун']},
  brynza:{n:'Брынза',g:'Сыры',syn:['брынз']},
  mozz:{n:'Моцарелла',g:'Сыры',syn:['моцарел']},
  arahis:{n:'Арахис жареный солёный',g:'Снеки',syn:['арахис']},
  polosatik:{n:'Полосатик солёно-сушёный',g:'Снеки',syn:['полосатик']},
  solomka:{n:'Соломка минтая солёно-сушёная',g:'Снеки',syn:['соломка минта','минтая','минтай солен']},
  kartofel:{n:'Картофель',g:'Овощи',syn:['картоф']},
  morkov:{n:'Морковь',g:'Овощи',syn:['морков']},
  luk:{n:'Лук репчатый',g:'Овощи',syn:['лук репч']},
  luk_zel:{n:'Лук зелёный',g:'Овощи',syn:['лук зелен','зеленый лук']},
  kapusta:{n:'Капуста белокочанная',g:'Овощи',syn:['капуст']},
  svekla:{n:'Свёкла',g:'Овощи',syn:['свекл']},
  ogurec:{n:'Огурцы свежие',g:'Овощи',syn:['огурцы свеж','огурец','огурцы']},
  pomidor:{n:'Помидоры',g:'Овощи',syn:['помидор','томаты ']},
  chesnok:{n:'Чеснок',g:'Овощи',syn:['чеснок']},
  ukrop:{n:'Зелень (укроп, петрушка)',g:'Овощи',syn:['укроп','петрушк','зелень']},
  perec_bolg:{n:'Перец сладкий',g:'Овощи',syn:['перец сладк','перец болгар']},

function toGrams(ing, q, u) {
  if (q == null) return null;
  if (u === 'г') return { g: q, approx: false };
  if (u === 'кг') return { g: q * 1000, approx: false };
  if (u === 'мл') return { g: q * (DENS[ing] || 1), approx: !!DENS[ing] && DENS[ing] !== 1 };
  if (u === 'л') return { g: q * 1000 * (DENS[ing] || 1), approx: !!DENS[ing] && DENS[ing] !== 1 };
  if (u === 'банка' && JAR[ing]) return { g: q * JAR[ing], approx: false };
  if (u === 'ломт.' && SLICE[ing]) return { g: q * SLICE[ing], approx: true };
  if ((u === 'шт' || u === 'зуб.') && PIECE[ing] != null) return { g: q * PIECE[ing], approx: true };
  if (u === 'ч. л.' && TSP[ing]) return { g: q * TSP[ing], approx: true };
  return null;
}

function allSkus() { return SKU0.concat(Object.values(DATA.skuimp).map(s => Object.assign({ src: 'import' }, s))); }
let _skuMap = null, _skuKey = '';
function skuById(id) {
  const key = Object.keys(DATA.skuimp).join(',');
  if (!_skuMap || key !== _skuKey) { _skuMap = {}; allSkus().forEach(s => _skuMap[s.id] = s); _skuKey = key; }

}
function linksOf(id) {

}

/* ---------- Подбор ---------- */
const RANK = { ok: 0, sub: 1, check: 2, miss: 3 };
const SLABEL = { ok: 'Состав есть', sub: 'Нужна замена', check: 'Проверить', miss: 'Не хватает' };
function evalRecipe(r, heroId, IDX) {
  IDX = IDX || ingIndex();
  let heroIdx = -1, heroInfo = null;
  if (heroId) {
    const hl = linksOf(heroId).filter(l => l.st !== 'no');
    for (let i = 0; i < r.L.length && heroIdx < 0; i++) {
      const ln = r.L[i]; if (!ln.h) continue;
      const pool = [ln.i].concat(ln.a || []);
      let m = hl.find(l => pool.includes(l.ing)), via = 'main';
      if (!m) { m = hl.find(l => (ln.ca || []).includes(l.ing)); via = 'ca'; }
      if (m) { heroIdx = i; heroInfo = { link: m, via }; }
    }
    if (heroIdx < 0) return null;
  }
  const cand = ids => { const out = []; ids.forEach(x => (IDX[x] || []).forEach(c => { if (!out.find(o => o.id === c.id)) out.push(Object.assign({ ing: x }, c)); })); return out; };
  const lines = r.L.map((ln, i) => {
    if (ING[ln.i].base) return { st: 'base', skus: [] };
    if (i === heroIdx) {
      const why = heroInfo.link.st === 'need' ? 'Товар не подтверждён' : heroInfo.via === 'ca' ? 'Проверить на пробной готовке' : '';
      return { st: why ? 'check' : 'ok', skus: [{ id: heroId, ing: heroInfo.link.ing, st: heroInfo.link.st }], hero: true, why };
    }
    const c = cand([ln.i].concat(ln.a || []));
    const good = c.filter(x => usable(x.st));
    if (good.length) return { st: 'ok', skus: good };
    const cc = cand(ln.ca || []).filter(x => usable(x.st));
    if (cc.length && !ln.o) return { st: 'check', skus: cc, why: 'Вариант: ' + ING[cc[0].ing].n.toLowerCase() };
    const nd = c.filter(x => x.st === 'need');
    if (nd.length && !ln.o) return { st: 'check', skus: nd, why: 'Товар не подтверждён' };
    if (ln.o) return { st: 'opt', skus: [] };
    const sc = cand(ln.s || []).filter(x => usable(x.st));
    if (sc.length) return { st: 'sub', skus: sc, why: 'Замена: ' + ING[sc[0].ing].n.toLowerCase() };
    return { st: 'miss', skus: [] };
  });
  const has = s => lines.some(l => l.st === s);
  const status = has('miss') ? 'miss' : has('check') ? 'check' : has('sub') ? 'sub' : 'ok';
  const hl = heroIdx >= 0 ? r.L[heroIdx] : null;
  const sg = hl ? (hl.sg || 1) : 0;
  const score = r.f * 3 + (4 - r.d) * 2 + sg * 3 + r.sh * 2;
  const names = s => lines.map((l, i) => l.st === s ? ING[r.L[i].i].n.toLowerCase() : null).filter(Boolean);
  return { r, heroIdx, hl, heroIng: heroInfo ? heroInfo.link.ing : null, lines, status, sg, score, miss: names('miss'), check: names('check'), sub: names('sub') };
}
function variantsFor(skuId) {
  const IDX = ingIndex();
  return RECIPES.map(r => evalRecipe(r, skuId, IDX)).filter(Boolean).sort((a, b) => RANK[a.status] - RANK[b.status] || b.score - a.score);
}

const cardsArr = () => Object.values(DATA.cards).sort((a, b) => a.num - b.num);
function nextNum() { const used = new Set(cardsArr().map(c => c.num)); let n = 1; while (used.has(n)) n++; return n; }
function cardCheck(c) {
  const r = RECIPES.find(x => x.id === c.rid), out = { reasons: [], ev: null };
  if (!r) { out.reasons.push('Рецепт удалён из каталога'); return out; }
  if (r.v !== c.rv) out.reasons.push('Рецепт обновлён: v' + c.rv + ' → v' + r.v);
  if (!skuById(c.sku)) { out.reasons.push('Товара нет в ассортименте'); return out; }
  const ev = evalRecipe(r, c.sku, ingIndex(true)); out.ev = ev;
  if (!ev) { out.reasons.push('Товар больше не подходит к рецепту'); return out; }
  if (ev.status !== c.st) out.reasons.push('Состав: было «' + SLABEL[c.st] + '», стало «' + SLABEL[ev.status] + '»');
  Object.entries(c.sel || {}).forEach(([i, sid]) => { const ln = ev.lines[i]; if (ln && sid && !ln.skus.find(s => s.id === sid)) out.reasons.push('Не подходит: ' + ((skuById(sid) || {}).n || sid)); });
  return out;
}

  basket:'<path d="M4 9h16l-1.5 9.2a2 2 0 0 1-2 1.8h-9a2 2 0 0 1-2-1.8z"/><path d="M8.5 9l3.5-5 3.5 5"/>',
  list:'<path d="M9 6h11M9 12h11M9 18h11"/><circle cx="4.5" cy="6" r="1"/><circle cx="4.5" cy="12" r="1"/><circle cx="4.5" cy="18" r="1"/>',
  trash:'<path d="M5 7h14M10 7V5h4v2M7 7l1 12h8l1-12"/>',
  'Салат':'<path d="M5 19c9 0 14-6 14-14C10 5 5 10 5 19z"/><path d="M5 19l8-8"/>',
  'Суп':'<path d="M3.5 11h17a8.5 8.5 0 0 1-17 0z"/><path d="M9 7.5c0-1 1-1.5 0-3M13 7.5c0-1 1-1.5 0-3"/>',
  'Горячее':'<path d="M12 3c1 4 5 5.5 5 10a5 5 0 0 1-10 0c0-2.5 1.5-4 2-5.5 1 1.5 2 2 3 2 0-2-1-4.5 0-6.5z"/>',
  'Закуска':'<path d="M3 11l9-5 9 5z"/><path d="M4 14h16M5 17h14v2H5z"/>',
  'Завтрак':'<circle cx="12" cy="12" r="4"/><path d="M12 3v2M12 19v2M3 12h2M19 12h2M5.6 5.6l1.4 1.4M17 17l1.4 1.4M5.6 18.4L7 17M17 7l1.4-1.4"/>',
  'Десерт':'<path d="M6 11h12l-2 9H8z"/><path d="M7 11a5 5 0 0 1 10 0"/>',
  'Напиток':'<path d="M6 8h11v6a5 5 0 0 1-5 5h-1a5 5 0 0 1-5-5z"/><path d="M17 10h1.5a2 2 0 0 1 0 4H17"/>'
};
const ico = (k, cls) => `<svg class="ic${cls ? ' ' + cls : ''}" viewBox="0 0 24 24" aria-hidden="true">${IC[k] || IC.list}</svg>`;
const fmtT = m => m >= 60 ? (Math.floor(m / 60) + ' ч' + (m % 60 ? ' ' + (m % 60) + ' мин' : '')) : m + ' мин';
function plural(n, a, b, c) { const m = n % 10, h = n % 100; return m === 1 && h !== 11 ? a : m >= 2 && m <= 4 && (h < 12 || h > 14) ? b : c; }
const roundG = g => g >= 100 ? Math.round(g / 5) * 5 : g >= 10 ? Math.round(g) : Math.round(g * 10) / 10;
const fmtG = (g, approx) => (approx ? '≈ ' : '') + String(roundG(g)).replace('.', ',') + ' г';
const inBasket = (rid, sku) => ST.basket.some(b => b.rid === rid && b.sku === sku);

/* Строки рецепта с конкретными товарами и граммами */
function recipeLines(r, heroSku, IDX) {
  const v = evalRecipe(r, heroSku, IDX);
  if (!v) return null;
  return r.L.map((ln, i) => {
    const L = v.lines[i];
    const ingId = L.hero && v.heroIng ? v.heroIng : ln.i;
    const sku = L.skus && L.skus.length ? L.skus[0].id : null;
    const gr = ING[ln.i].base ? null : toGrams(ln.i, ln.q, ln.u);
    return { ln, L, ing: ING[ingId], ingId, sku, gr, hero: !!L.hero, base: !!ING[ln.i].base, opt: !!ln.o };
  });
}
const qtyText = x => x.gr ? fmtG(x.gr.g, x.gr.approx) : (x.ln.q == null ? x.ln.u : String(x.ln.q).replace('.', ',') + ' ' + x.ln.u);

function render() {
  const a = document.activeElement, aid = a && a.id, pos = a && a.selectionStart;
  const n = ST.basket.length;
  document.querySelectorAll('.bk-n').forEach(e => e.textContent = n ? n : '');
  document.querySelectorAll('.bk-btn').forEach(e => e.classList.toggle('has', n > 0));
  $('#main').innerHTML = renderPage();
  renderModal();
  if (aid) { const el = document.getElementById(aid); if (el) { el.focus(); try { if (pos != null) el.setSelectionRange(pos, pos); } catch (e) {} } }
}

function skuMatches(nq) {
  return ownSkus().filter(s => (!nq || norm(s.n + ' ' + s.b + ' ' + s.cat + ' ' + linksOf(s.id).map(l => ING[l.ing] ? ING[l.ing].n : '').join(' ')).includes(nq)));
}
function renderPage() {
  const nq = norm(ST.q).trim(), IDX = ingIndex();
  const dc = id => RECIPES.reduce((k, r) => k + (evalRecipe(r, id, IDX) ? 1 : 0), 0);
  let drop = '';
  if (ST.qOpen && nq) {
    const res = skuMatches(nq).slice(0, 8);
    ST.qRes = res.map(s => s.id);
    drop = `<div class="drop" role="listbox" id="qlist">${res.length ? res.map((s, i) => `<button class="drop-i${i === ST.qIdx ? ' hl' : ''}" role="option" data-act="pick-sku" data-id="${s.id}"><span class="sku-t"><span class="sku-n">${esc(s.n)}</span><span class="sku-m">${esc(s.cat)}</span></span><span class="sku-c">${dc(s.id)}</span></button>`).join('') : '<p class="empty">Ничего не найдено</p>'}</div>`;
  } else ST.qRes = [];
  const cats = [...new Set(ownSkus().map(s => s.cat))];
  const shelves = cats.map(c => `<div class="shelf"><h3>${esc(c)}</h3><div class="pgrid">${ownSkus().filter(s => s.cat === c).map(s => {
    const n = dc(s.id);
    return `<button class="pcard${ST.sku === s.id ? ' on' : ''}" data-act="pick-sku" data-id="${s.id}" aria-pressed="${ST.sku === s.id}"><span class="pc-n">${esc(s.n)}</span><span class="pc-c">${n} ${plural(n, 'рецепт', 'рецепта', 'рецептов')}</span></button>`;
  }).join('')}</div></div>`).join('');
  return `<div class="searchbox">
      <label class="search big">${ico('search')}<input id="q" type="search" placeholder="Найти товар: колбаса, творог, пельмени…" value="${esc(ST.q)}" data-in="q" autocomplete="off" aria-label="Поиск товара" aria-controls="qlist" aria-expanded="${!!drop}">${ST.q ? `<button class="qx" data-act="q-clear" aria-label="Очистить">${ico('x')}</button>` : ''}</label>
      ${drop}
    </div>
    <section class="shelves">${shelves}</section>
    <section id="recipes" class="recipes">${renderRecipes(IDX)}</section>`;
}
function renderRecipes(IDX) {
  const s = skuById(ST.sku);
  if (!s) return `<div class="card empty">Выберите товар</div>`;
  const vs = variantsFor(s.id);
  const types = ['Все'].concat([...new Set(vs.map(v => v.r.t))]);
  const list = vs.filter(v => ST.dtype === 'Все' || v.r.t === ST.dtype);
  return `<div class="rhead"><div><span class="rh-k">Рецепты с товаром</span><h2>${esc(s.n)}</h2></div><span class="rh-n">${vs.length}</span></div>
    ${types.length > 2 ? `<div class="chips">${types.map(t => `<button class="chip${ST.dtype === t ? ' on' : ''}" data-act="dtype" data-v="${t}">${t}</button>`).join('')}</div>` : ''}
    <div class="rgrid">${list.map(v => recipeCard(v.r, s.id, IDX)).join('') || '<div class="card empty">Нет рецептов</div>'}</div>`;
}
function recipeCard(r, skuId, IDX) {
  const lines = recipeLines(r, skuId, IDX);
  const open = ST.open.includes(r.id), saved = inBasket(r.id, skuId);
  const req = lines.filter(x => !x.base && !x.opt && x.ln.q != null);
  const chips = req.map(x => `<span class="g${x.hero ? ' hero' : ''}">${esc(x.ing.n)} <b>${qtyText(x)}</b></span>`).join('');
  const full = open ? `<div class="rc-full">
      <h4>Состав на ${r.p} ${plural(r.p, 'порцию', 'порции', 'порций')}</h4>
      <ul class="ings">${lines.filter(x => !x.base).map(x => `<li class="${x.hero ? 'hero' : ''}"><span class="i-n">${esc(x.ing.n)}<small>${x.opt ? 'по желанию · ' : ''}${x.sku ? esc(skuById(x.sku).n) : '<span class="bad">нет в ассортименте</span>'}</small></span><span class="i-q">${qtyText(x)}</span></li>`).join('')}</ul>
      <h4>Приготовление</h4>
      <ol class="steps">${r.S.map(t => `<li>${esc(t)}</li>`).join('')}</ol>
      ${r.note ? `<p class="note">${esc(r.note)}</p>` : ''}
    </div>` : '';
  return `<article class="rc${open ? ' open' : ''}${saved ? ' saved' : ''}">
    <div class="rc-top"><span class="rc-ic">${ico(r.t)}</span><div class="rc-t"><h4>${esc(r.n)}</h4><span class="rc-m">${ico('clock')}${fmtT(r.tt)} · ${r.p} ${plural(r.p, 'порция', 'порции', 'порций')} · ${r.t}</span></div></div>
    <div class="gchips">${chips}</div>
    ${open ? '' : `<p class="rc-s">${esc(r.S.join(' '))}</p>`}
    ${full}
    <div class="rc-act">
      <button class="rbtn" data-act="toggle-open" data-id="${r.id}" aria-expanded="${open}">${ico(open ? 'minus' : 'plus')}<span>${open ? 'Свернуть' : 'Состав и готовка'}</span></button>
      <button class="rbtn save${saved ? ' on' : ''}" data-act="toggle-basket" data-id="${r.id}" data-sku="${skuId}" aria-pressed="${saved}">${ico('check')}<span>${saved ? 'На съёмке' : 'На съёмку'}</span></button>
    </div>
  </article>`;
}

/* ---------- Корзина и список покупок ---------- */
function basketItems() { return ST.basket.map(b => ({ b, r: RECIPES.find(x => x.id === b.rid), s: skuById(b.sku) })).filter(x => x.r && x.s); }
function shoppingList() {
  const FULL = ingIndex(true), m = {}, taste = new Set();
  basketItems().forEach(({ r, s }) => {
    const lines = recipeLines(r, s.id, FULL); if (!lines) return;
    lines.forEach(x => {
      if (x.base || x.opt) return;
      if (x.ln.q == null) { taste.add(x.ing.n.toLowerCase()); return; }
      const key = x.sku || ('ing:' + x.ingId);
      const e = m[key] = m[key] || { name: x.sku && skuById(x.sku).src !== 'added' ? skuById(x.sku).n : x.ing.n, ing: x.ing.n, g: 0, approx: false, other: [] };
      if (x.gr) { e.g += x.gr.g; e.approx = e.approx || x.gr.approx; } else e.other.push(String(x.ln.q).replace('.', ',') + ' ' + x.ln.u);
    });
  });
  const rows = Object.values(m).sort((a, b) => a.name.localeCompare(b.name, 'ru'));
  return { rows, taste: [...taste].filter(t => !rows.some(r => r.ing.toLowerCase() === t)) };
}
const rowQty = e => [e.g ? fmtG(e.g, e.approx) : '', ...e.other].filter(Boolean).join(' + ');
function shoppingText() {
  const d = shoppingList();
  return 'Продукты для покупки\n\n' + d.rows.map(e => e.name + ' — ' + rowQty(e)).join('\n') + (d.taste.length ? '\n\nПо вкусу: ' + d.taste.join(', ') : '');
}
function renderModal() {
  const m = ST.modal, box = $('#drawer'), back = $('#back');
  box.hidden = back.hidden = !m;
  document.body.classList.toggle('lock', !!m);
  if (!m) return;
  box.className = 'drawer' + (m === 'list' ? ' center' : '');
  box.innerHTML = m === 'list' ? listView() : basketView();
}
function basketView() {
  const items = basketItems();
  return `<div class="grab" aria-hidden="true"></div><div class="dr-head"><button class="iconbtn" data-act="close" aria-label="Закрыть">${ico('back')}</button><h2>Корзина рецептов</h2><span class="rh-n">${items.length}</span></div>
  <div class="dr-body">
    ${items.length ? `<div class="blist">${items.map(({ b, r, s }) => `<div class="bitem"><span class="rc-ic">${ico(r.t)}</span><div class="bi-t"><b>${esc(r.n)}</b><span>${esc(s.n)}</span><span class="rc-m">${fmtT(r.tt)} · ${r.p} ${plural(r.p, 'порция', 'порции', 'порций')}</span></div><button class="iconbtn sm" data-act="bk-remove" data-id="${b.rid}" data-sku="${b.sku}" aria-label="Убрать из корзины">${ico('x')}</button></div>`).join('')}</div>
      <div class="bfoot"><button class="btn pri wide" data-act="show-list">${ico('list')}Импорт продуктов</button><button class="lnk mute" data-act="bk-clear">${ico('trash')}Очистить корзину</button></div>`
    : `<div class="empty big">${ico('basket', 'ic-big')}<p>Корзина пуста</p><span class="mute">Отмечайте рецепты кнопкой «На съёмку»</span></div>`}
  </div>`;
}
function listView() {
  const d = shoppingList(), total = d.rows.reduce((a, e) => a + e.g, 0);
  return `<div class="dr-head"><button class="iconbtn" data-act="back-basket" aria-label="Назад">${ico('back')}</button><h2>Продукты для покупки</h2></div>
  <div class="dr-body">
    <p class="mute sm">${ST.basket.length} ${plural(ST.basket.length, 'рецепт', 'рецепта', 'рецептов')} · ${d.rows.length} ${plural(d.rows.length, 'продукт', 'продукта', 'продуктов')}</p>
    <div class="shop">${d.rows.map(e => `<div class="sh-r"><span class="sh-n">${esc(e.name)}</span><span class="sh-q">${rowQty(e)}</span></div>`).join('')}
    <div class="sh-r total"><span class="sh-n">Итого</span><span class="sh-q">${fmtG(total, d.rows.some(e => e.approx))}</span></div></div>
    ${d.taste.length ? `<p class="mute sm">По вкусу: ${esc(d.taste.join(', '))}</p>` : ''}
    <div class="actions"><button class="btn" data-act="copy-list">${ico('copy')}Скопировать</button><button class="btn" data-act="close">Закрыть</button></div>
  </div>`;
}

/* ===== ДЕЙСТВИЯ ===== */
let toastT;
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2400); }
function copyText(text) {
  const fb = () => { const ta = $('#copybuf'); ta.hidden = false; ta.value = text; ta.select(); toast('Текст выделен — скопируйте'); setTimeout(() => ta.hidden = true, 8000); };
  try { navigator.clipboard.writeText(text).then(() => toast('Скопировано'), fb); } catch (e) { fb(); }
}
function saveBasket() { lsSet('basket', JSON.stringify(ST.basket)); }
function pickSku(id) {
  ST.sku = id; ST.dtype = 'Все'; ST.open = []; ST.q = ''; ST.qOpen = false; ST.qIdx = 0;
  if (document.activeElement) document.activeElement.blur();
  render(); revealSelected();
  const el = $('#recipes'); if (el) el.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (ST.qOpen && !e.target.closest('.searchbox')) { ST.qOpen = false; if (!b) render(); }
  if (!b || b.disabled) return;
  const a = b.dataset.act, id = b.dataset.id, v = b.dataset.v;
  switch (a) {
    case 'pick-sku': pickSku(id); break;
    case 'q-clear': ST.q = ''; ST.qOpen = false; render(); $('#q').focus(); break;
    case 'dtype': ST.dtype = v; render(); break;
    case 'toggle-open': { const i = ST.open.indexOf(id); i >= 0 ? ST.open.splice(i, 1) : ST.open.push(id); render(); break; }
    case 'toggle-basket': {
      const sku = b.dataset.sku, i = ST.basket.findIndex(x => x.rid === id && x.sku === sku);
      if (i >= 0) ST.basket.splice(i, 1); else ST.basket.push({ rid: id, sku, at: Date.now() });
      saveBasket(); render(); if (i < 0) toast('Рецепт добавлен на съёмку'); break;
    }
    case 'open-basket': ST.modal = 'basket'; render(); $('#drawer').scrollTop = 0; break;
    case 'bk-remove': ST.basket = ST.basket.filter(x => !(x.rid === id && x.sku === b.dataset.sku)); saveBasket(); render(); break;
    case 'bk-clear': if (ST.confirmClear) { ST.basket = []; ST.confirmClear = false; saveBasket(); render(); } else { ST.confirmClear = true; b.innerHTML = 'Нажмите ещё раз, чтобы очистить'; setTimeout(() => { ST.confirmClear = false; }, 3000); } break;
    case 'show-list': ST.modal = 'list'; render(); $('#drawer').scrollTop = 0; break;
    case 'back-basket': ST.modal = 'basket'; render(); break;
    case 'copy-list': copyText(shoppingText()); break;
    case 'close': ST.modal = null; render(); break;
  }
});
document.addEventListener('focusin', e => { if (e.target.id === 'q' && ST.q && !ST.qOpen) { ST.qOpen = true; render(); } });
document.addEventListener('keydown', e => {
  if (e.target.id === 'q') {
    const n = (ST.qRes || []).length;
    if (e.key === 'ArrowDown' && n) { e.preventDefault(); ST.qOpen = true; ST.qIdx = Math.min(n - 1, (ST.qIdx || 0) + 1); render(); return; }
    if (e.key === 'ArrowUp' && n) { e.preventDefault(); ST.qIdx = Math.max(0, (ST.qIdx || 0) - 1); render(); return; }
    if (e.key === 'Enter' && n) { e.preventDefault(); pickSku(ST.qRes[ST.qIdx || 0]); return; }
    if (e.key === 'Escape' && ST.qOpen) { ST.qOpen = false; render(); return; }
  }
  if (e.key === 'Escape' && ST.modal) { ST.modal = null; render(); }
});
let inT;
document.addEventListener('input', e => {
  const t = e.target;
  if (t.dataset.in) { ST[t.dataset.in] = t.value; if (t.id === 'q') { ST.qOpen = true; ST.qIdx = 0; } clearTimeout(inT); inT = setTimeout(render, 120); }
});

function revealSelected() {
  const el = document.querySelector('.pcard.on'); if (!el) return;
  const row = el.parentElement; if (row.scrollWidth <= row.clientWidth) return;
  row.scrollLeft = Math.max(0, el.offsetLeft - row.offsetLeft - 16);
}
/* ---------- Запуск ---------- */
render(); revealSelected();

</script>
</body>
</html>
